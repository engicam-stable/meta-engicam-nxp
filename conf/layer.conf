# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-engicam-nxp"
BBFILE_PATTERN_meta-engicam-nxp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-engicam-nxp = "6"

LAYERDEPENDS_meta-engicam-nxp = "core"
LAYERSERIES_COMPAT_meta-engicam-nxp = "scarthgap"
BBFILES_DYNAMIC += " \
        meta-summit-radio:${LAYERDIR}/dynamic-layers/radio-firmware/*.bbappend \
        meta-summit-radio:${LAYERDIR}/dynamic-layers/summit-backports/*.bbappend  \
"
