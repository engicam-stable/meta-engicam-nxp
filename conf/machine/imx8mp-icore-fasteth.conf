#@TYPE: Machine
#@NAME: Engicam i.Core MX8M Plus Fast Ethernet boards with LPDDR4
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for Engicam i.Core MX8M Plus Fast Ethernet boards with LPDDR4
#@MAINTAINER: support <support@engicam.com>

require include/imx8mp-engicam.inc

DELTA_KERNEL_DEFCONFIG="${UNPACKDIR}/kernel-config/*"

# NXP kernel has additional DTB files for various board configuration and
# derivates. Include them here for NXP BSP only
KERNEL_DEVICETREE += " \
    engicam/imx8mp-icore-fasteth-ctouch2-amp10.dtb \
    engicam/imx8mp-icore-fasteth-ctouch2.dtb \
    engicam/imx8mp-icore-fasteth-ctouch3.1-yes7.dtb \
    engicam/imx8mp-icore-fasteth-ctouch3.1.dtb \
    engicam/imx8mp-icore-fasteth-starterkit.dtb \
"

UBOOT_DTB_NAME = "imx8mp-icore-fasteth.dtb"

UBOOT_CONFIG_BASENAME = "imx8mp_icore_fasteth"
UBOOT_CONFIG ??= "2gb"
UBOOT_CONFIG[1gb] = "${UBOOT_CONFIG_BASENAME}_1gb_defconfig"
UBOOT_CONFIG[2gb] = "${UBOOT_CONFIG_BASENAME}_defconfig"
UBOOT_CONFIG[4gb] = "${UBOOT_CONFIG_BASENAME}_4gb_defconfig"

# Set DDR FIRMWARE
DDR_FIRMWARE_VERSION = "202006"
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_1d_imem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_imem_${DDR_FIRMWARE_VERSION}.bin \
"

IMXBOOT_TARGETS_BASENAME = "flash_evk"

# Mainline BSP doesn't support LPDDR4 so it must be set to nxp.
# Also this machine isn't supported by u-boot-fslc but imx8mn-evk.inc already
# set the bootloader to u-boot-imx instead when NXP BSP is used.
IMX_DEFAULT_BSP = "nxp"
